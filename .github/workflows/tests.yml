name: Verificación automática

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxis JavaScript
        run: |
          node --check solver.js
          node --check app.js
      - name: Ejecutar pruebas matemáticas
        run: node tests/solver.test.js
